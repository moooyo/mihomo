# 5gpn mihomo data plane — install-time seed (rendered by install.sh). This
# file is fully operator-owned from here on: no region of it is daemon-
# managed by the daemon -- edit it via the
# console's mihomo config editor (GET/PUT /api/mihomo/config), '5gpn
# mihomo-reset' to restore this seed, or by hand. The console's policy
# engine only ever decides "gateway or not" (DNS layer); everything below
# about what happens to gateway-bound traffic is yours to shape.
external-controller: 127.0.0.1:19091
secret: 'testsecret'
profile: { store-selected: true }
mode: rule
log-level: info

listeners:
  - {name: gateway, type: tunnel, listen: 10.0.1.20, port: 443, network: [tcp, udp], target: 'console.5gpn.test:443'}
  - name: intercept-egress
    type: mixed
    listen: 127.0.0.1
    port: 17890
    udp: true
    users:
      - {username: module-up-abcdefghijklmnop, password: module-up-password-abcdefghijklmnopqrst}

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  force-domain: [console.5gpn.test]
  sniff:
    TLS:  { ports: [443, 8080, 8443, 5060] }
    QUIC: { ports: [443, 5060] }
    HTTP: { ports: [80, 8080, 8443, 5060] }

dns:
  enable: true
  enhanced-mode: normal
  nameserver: ["udp://127.0.0.1:5354"]   # 5gpn-dns loopback selector: extension China/trust binding, otherwise trust

hosts:
  console.5gpn.test: 127.0.0.1
  zash.5gpn.test:    127.0.0.2

rule-providers:
  whitelist: {type: file, behavior: ipcidr, format: text, path: ./whitelist.txt}

# Egress skeleton -- empty by default. Add proxy nodes (proxies:) and/or
# node-subscription providers (proxy-providers:), then wire them into
# proxy-groups as you like; the terminal MATCH rule below routes every
# gateway-bound query that reached this point to the Proxies group.
proxies:
  - name: MODULE-INTERCEPT
    runtime-overlay-processor: true
    type: socks5
    server: 127.0.0.1
    port: 18080
    username: module-in-abcdefghijklmnop
    password: module-in-password-abcdefghijklmnopqrst
    udp: true
proxy-providers: {}

proxy-groups:
  - {name: Proxies, type: select, proxies: [DIRECT]}

rules:
  - AND,((DOMAIN,console.5gpn.test),(NETWORK,UDP)),REJECT
  - AND,((DOMAIN,console.5gpn.test),(DST-PORT,80)),REJECT
  - AND,((DOMAIN,console.5gpn.test),(DST-PORT,8080)),REJECT
  - AND,((DOMAIN,console.5gpn.test),(DST-PORT,8443)),REJECT
  - AND,((DOMAIN,zash.5gpn.test),(NETWORK,UDP)),REJECT
  - AND,((DOMAIN,zash.5gpn.test),(DST-PORT,80)),REJECT
  - AND,((DOMAIN,zash.5gpn.test),(DST-PORT,8080)),REJECT
  - AND,((DOMAIN,zash.5gpn.test),(DST-PORT,8443)),REJECT
  - AND,((DOMAIN,console.5gpn.test),(DST-PORT,5060)),REJECT
  - AND,((DOMAIN,zash.5gpn.test),(DST-PORT,5060)),REJECT
  # Both panel allow rules exclude intercept-egress. They must sit above the
  # loopback deny (the console resolves to 127.0.0.1) and therefore above the
  # egress terminator; without the exclusion a compromised sidecar dialling
  # either hostname would reach the gateway's own management plane.
  - AND,((NOT,((IN-NAME,intercept-egress))),(DOMAIN,console.5gpn.test)),DIRECT
  - AND,((NOT,((IN-NAME,intercept-egress))),(DOMAIN,zash.5gpn.test),(RULE-SET,whitelist,DIRECT,src)),DIRECT
  - DOMAIN,zash.5gpn.test,REJECT
  - IP-CIDR,10.0.1.20/32,REJECT,no-resolve
  - IP-CIDR,127.0.0.0/8,REJECT,no-resolve
  - IP-CIDR,10.0.0.0/8,REJECT,no-resolve
  - IP-CIDR,172.16.0.0/12,REJECT,no-resolve
  - IP-CIDR,192.168.0.0/16,REJECT,no-resolve
  - IP-CIDR,100.64.0.0/10,REJECT,no-resolve
  - IP-CIDR,169.254.0.0/16,REJECT,no-resolve
  # Every sidecar egress selector is published immediately above this
  # fail-closed terminator. Unknown or stale sidecar traffic must never fall
  # through to the operator's terminal MATCH rule.
  - RUNTIME-OVERLAY,5gpn,egress
  - IN-NAME,intercept-egress,REJECT
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - RUNTIME-OVERLAY,5gpn,client
  - MATCH,Proxies

runtime-overlay:
  owner: 5gpn
  control-socket: /tmp/seedtest/control.sock
  generation-socket: /tmp/seedtest/generation.sock
