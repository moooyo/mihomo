name: Test

# This workflow validates the 5gpn delivery branch across supported platforms.

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - feat/5gpn-monolith
    tags:
      - "v*"
  pull_request:
    branches:
      - feat/5gpn-monolith

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 1.25 is the module floor; Go 1.26 is the release toolchain.
          - os: ubuntu-latest
            go-version: "1.25"
          - os: ubuntu-latest
            go-version: "1.26"
          - os: windows-latest
            go-version: "1.25"
          - os: windows-latest
            go-version: "1.26"
          # Native ARM runners exercise the production isolation implementations.
          - os: ubuntu-24.04-arm
            go-version: "1.26"
          - os: windows-11-arm
            go-version: "1.26"
          # macOS is a test-only harness for the private worker protocol. The
          # production binary intentionally fails its startup isolation probe.
          - os: macos-latest
            go-version: "1.26"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      # Prevent MSYS from rewriting paths passed to subprocesses.
      MSYS_NO_PATHCONV: true
      SKIP_INTEROP_TEST: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ matrix.go-version }}

      - name: Verify Go installation
        run: go version

      - name: Verify delivery contract
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26' }}
        run: bash ./.github/scripts/verify-delivery-contract.sh

      - name: Remove unsupported inbound tests on macOS
        if: ${{ runner.os == 'macOS' }}
        run: rm -rf listener/inbound/*_test.go

      - name: Test
        run: go test ./... -v -count=1

      - name: Test with gVisor tag
        run: go test ./... -v -count=1 -tags "with_gvisor"

      - name: Verify 5gpn packages and complete build graph
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26' }}
        run: |
          go vet ./5gpn/...
          go build ./...
