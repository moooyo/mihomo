name: Build

# This workflow is the release authority for the 5gpn delivery branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "5gpn mihomo release tag"
        required: true

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref }}"
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  DELIVERY_BRANCH: feat/5gpn-monolith
  GO_VERSION: "1.26"

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DELIVERY_BRANCH}" ]]; then
            echo "Releases must run from ${DELIVERY_BRANCH}, got ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-monolith\.[1-9][0-9]*$ ]]; then
            echo "Invalid 5gpn mihomo release tag: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          git fetch origin \
            "+refs/heads/${DELIVERY_BRANCH}:refs/remotes/origin/${DELIVERY_BRANCH}" \
            "+refs/tags/*:refs/tags/*"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DELIVERY_BRANCH}"; then
            echo "Release commit ${GITHUB_SHA} is not on ${DELIVERY_BRANCH}." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
            tag_type="$(git cat-file -t "refs/tags/${RELEASE_VERSION}")"
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_VERSION}^{}")"
            if [[ "${tag_type}" != "tag" || "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag is not the expected annotated tag for ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi
          previous="$(git tag --merged "origin/${DELIVERY_BRANCH}" \
            --list 'v*-monolith.*' --sort=-version:refname \
            | grep -vxF "${RELEASE_VERSION}" | head -n 1 || true)"
          if [[ -n "${previous}" ]]; then
            newest="$(printf '%s\n%s\n' "${previous}" "${RELEASE_VERSION}" | sort -V | tail -n 1)"
            if [[ "${newest}" != "${RELEASE_VERSION}" || "${previous}" == "${RELEASE_VERSION}" ]]; then
              echo "Release ${RELEASE_VERSION} must be newer than ${previous}." >&2
              exit 1
            fi
          fi
          status="$(curl --silent --show-error --output /tmp/existing-release.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}")"
          case "${status}" in
            404) ;;
            200)
              echo "GitHub release already exists: ${RELEASE_VERSION}" >&2
              exit 1
              ;;
            *)
              echo "Could not prove release absence; GitHub returned HTTP ${status}." >&2
              exit 1
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Verify source and tests
        env:
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
          SKIP_INTEROP_TEST: 1
        run: |
          set -euo pipefail
          bash ./.github/scripts/verify-delivery-contract.sh
          go mod verify
          go vet ./5gpn/...
          go test ./... -count=1
          go test ./... -count=1 -tags "with_gvisor"
          go build ./...

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs:
          - { goos: linux, goarch: "386", go386: sse2, output: "386" }
          - { goos: linux, goarch: "386", go386: softfloat, output: "386-softfloat" }
          - { goos: linux, goarch: amd64, goamd64: v1, output: amd64-compatible }
          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64, tarball: true }
          - { goos: linux, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: linux, goarch: amd64, goamd64: v2, output: amd64-v2 }
          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: linux, goarch: arm, goarm: "5", output: armv5 }
          - { goos: linux, goarch: arm, goarm: "6", output: armv6 }
          - { goos: linux, goarch: arm, goarm: "7", output: armv7 }
          - { goos: linux, goarch: mips, gomips: hardfloat, output: mips-hardfloat }
          - { goos: linux, goarch: mips, gomips: softfloat, output: mips-softfloat }
          - { goos: linux, goarch: mipsle, gomips: hardfloat, output: mipsle-hardfloat }
          - { goos: linux, goarch: mipsle, gomips: softfloat, output: mipsle-softfloat }
          - { goos: linux, goarch: mips64, output: mips64 }
          - { goos: linux, goarch: mips64le, output: mips64le }
          - { goos: linux, goarch: loong64, output: loong64-abi1, toolchain: loong64-abi1 }
          - { goos: linux, goarch: loong64, output: loong64-abi2 }
          - { goos: linux, goarch: riscv64, output: riscv64 }
          - { goos: linux, goarch: s390x, output: s390x }
          - { goos: linux, goarch: ppc64le, output: ppc64le }
          - { goos: windows, goarch: "386", output: "386" }
          - { goos: windows, goarch: amd64, goamd64: v1, output: amd64-compatible }
          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64 }
          - { goos: windows, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: windows, goarch: amd64, goamd64: v2, output: amd64-v2 }
          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: windows, goarch: arm64, output: arm64 }

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ matrix.jobs.toolchain != 'loong64-abi1' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Go for loong64 ABI1
        if: ${{ matrix.jobs.toolchain == 'loong64-abi1' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/loongarch64-golang/releases/download/1.26.0"
          go-version: 1.26.0

      - name: Verify Go installation
        run: go version

      - name: Set variables
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          VERSION="${VERSION//\//-}"
          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            VERSION="${RELEASE_VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILDTIME=$(date -u --iso-8601=seconds)" >> "${GITHUB_ENV}"
          echo "CGO_ENABLED=0" >> "${GITHUB_ENV}"
          echo "BUILDTAG=-extldflags --static" >> "${GITHUB_ENV}"
          echo "GOTOOLCHAIN=local" >> "${GITHUB_ENV}"

      - name: Update CA bundle
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build core
        env:
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          GOAMD64: ${{ matrix.jobs.goamd64 }}
          GO386: ${{ matrix.jobs.go386 }}
          GOARM: ${{ matrix.jobs.goarm }}
          GOMIPS: ${{ matrix.jobs.gomips }}
        run: |
          set -euo pipefail
          go build -v -tags "with_gvisor" -trimpath \
            -ldflags "${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          if [[ "${{ matrix.jobs.goos }}" == "windows" ]]; then
            cp mihomo.exe "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}.exe"
            zip -r "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}-${VERSION}.zip" \
              "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}.exe"
          else
            cp mihomo "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
            gzip -c "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}" \
              > "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}-${VERSION}.gz"
            rm "mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          fi

      - name: Pack Go toolchain
        if: ${{ matrix.jobs.tarball == true }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/toolchain/go"
          cp -r "$(go env GOROOT)/." "${GITHUB_WORKSPACE}/toolchain/go/"
          tar -C "${GITHUB_WORKSPACE}/toolchain" -czf "${GITHUB_WORKSPACE}/toolchain.tar.gz" .
          rm -rf "${GITHUB_WORKSPACE}/toolchain"

      - name: Pack Go module vendor tree
        if: ${{ matrix.jobs.tarball == true }}
        run: |
          set -euo pipefail
          go mod vendor
          tar -czf "${GITHUB_WORKSPACE}/vendor.tar.gz" vendor

      - name: Save version
        run: echo "${VERSION}" > version.txt

      - name: Archive production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          path: |
            mihomo*.gz
            mihomo*.zip
            toolchain.tar.gz
            vendor.tar.gz
            version.txt

  Upload-Release:
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    concurrency:
      group: mihomo-monolith-publish
      cancel-in-progress: false
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Revalidate immutable release inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DELIVERY_BRANCH}" ]]; then
            echo "Releases must run from ${DELIVERY_BRANCH}, got ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ ! "${CURRENT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-monolith\.[1-9][0-9]*$ ]]; then
            echo "Invalid 5gpn mihomo release tag: ${CURRENT_VERSION}" >&2
            exit 1
          fi
          git fetch origin \
            "+refs/heads/${DELIVERY_BRANCH}:refs/remotes/origin/${DELIVERY_BRANCH}" \
            "+refs/tags/*:refs/tags/*"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DELIVERY_BRANCH}"; then
            echo "Release commit ${GITHUB_SHA} is not on ${DELIVERY_BRANCH}." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${CURRENT_VERSION}"; then
            tag_type="$(git cat-file -t "refs/tags/${CURRENT_VERSION}")"
            tag_commit="$(git rev-parse "refs/tags/${CURRENT_VERSION}^{}")"
            if [[ "${tag_type}" != "tag" || "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag is not the expected annotated tag for ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi
          status="$(curl --silent --show-error --output /tmp/existing-release.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${CURRENT_VERSION}")"
          if [[ "${status}" != "404" ]]; then
            echo "Release absence check returned HTTP ${status}; refusing publication." >&2
            exit 1
          fi
          previous="$(git tag --merged "origin/${DELIVERY_BRANCH}" \
            --list 'v*-monolith.*' --sort=-version:refname \
            | grep -vxF "${CURRENT_VERSION}" | head -n 1 || true)"
          if [[ -n "${previous}" ]]; then
            newest="$(printf '%s\n%s\n' "${previous}" "${CURRENT_VERSION}" | sort -V | tail -n 1)"
            if [[ "${newest}" != "${CURRENT_VERSION}" || "${previous}" == "${CURRENT_VERSION}" ]]; then
              echo "Release ${CURRENT_VERSION} must be newer than ${previous}." >&2
              exit 1
            fi
          fi
          echo "CURRENTVERSION=${CURRENT_VERSION}" >> "${GITHUB_ENV}"
          echo "PREVERSION=${previous}" >> "${GITHUB_ENV}"

      - name: Generate release notes
        run: |
          set -euo pipefail
          if [[ -n "${PREVERSION}" ]]; then
            bash ./.github/genReleaseNote.sh -v "${PREVERSION}...${CURRENTVERSION}"
          else
            printf '## Release %s\n' "${CURRENTVERSION}" > release.md
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: bin/
          merge-multiple: true

      - name: Calculate checksums
        run: |
          set -euo pipefail
          cd bin/
          find . -type f -not -name "checksums.*" -not -name "version.txt" -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Create and verify immutable tag
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${CURRENTVERSION}"; then
            tag_type="$(git cat-file -t "refs/tags/${CURRENTVERSION}")"
            local_commit="$(git rev-parse "refs/tags/${CURRENTVERSION}^{}")"
            if [[ "${tag_type}" != "tag" || "${local_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag is not the expected annotated tag for ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag -a "${CURRENTVERSION}" -m "Release ${CURRENTVERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${CURRENTVERSION}"
          fi
          local_commit="$(git rev-parse "refs/tags/${CURRENTVERSION}^{}")"
          if [[ "${local_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Local tag resolves to ${local_commit}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi
          remote_commit="$(git ls-remote origin "refs/tags/${CURRENTVERSION}^{}" | awk '{print $1}')"
          if [[ "${remote_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Remote tag resolves to ${remote_commit:-missing}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${CURRENTVERSION}" bin/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${CURRENTVERSION}" \
            --notes-file release.md \
            --verify-tag \
            --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CURRENTVERSION}" \
            | jq -e --arg tag "${CURRENTVERSION}" \
                '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' >/dev/null
          remote_commit="$(git ls-remote origin "refs/tags/${CURRENTVERSION}^{}" | awk '{print $1}')"
          if [[ "${remote_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Published tag moved to ${remote_commit:-missing}." >&2
            exit 1
          fi
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest}" != "${CURRENTVERSION}" ]]; then
            echo "Latest release is ${latest}, expected ${CURRENTVERSION}." >&2
            exit 1
          fi
